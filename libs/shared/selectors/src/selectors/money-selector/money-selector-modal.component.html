<div class="modal-body">
  @if (config) {
    <p class="lead text-center mb-2">
      <strong>{{ config.name }}</strong>
    </p>
  }
  <div class="row">
    <div class="form-group col-4">
      <label class="control-label" for="money-gold">
        <img src="assets/img/money/gold.gif" alt="" class="me-1" /><span [translate]="'SELECTORS.MONEY.GOLD'"></span>
      </label>
      <input
        id="money-gold"
        type="number"
        min="0"
        class="form-control form-control-sm"
        [ngModel]="gold()"
        (ngModelChange)="setCoin('gold', $event)"
      />
    </div>
    <div class="form-group col-4">
      <label class="control-label" for="money-silver">
        <img src="assets/img/money/silver.gif" alt="" class="me-1" /><span [translate]="'SELECTORS.MONEY.SILVER'"></span>
      </label>
      <input
        id="money-silver"
        type="number"
        min="0"
        class="form-control form-control-sm"
        [ngModel]="silver()"
        (ngModelChange)="setCoin('silver', $event)"
      />
    </div>
    <div class="form-group col-4">
      <label class="control-label" for="money-copper">
        <img src="assets/img/money/copper.gif" alt="" class="me-1" /><span [translate]="'SELECTORS.MONEY.COPPER'"></span>
      </label>
      <input
        id="money-copper"
        type="number"
        min="0"
        class="form-control form-control-sm"
        [ngModel]="copper()"
        (ngModelChange)="setCoin('copper', $event)"
      />
    </div>
  </div>
  <p class="mt-3 mb-0">
    <span [translate]="'SELECTORS.MONEY.TOTAL'"></span>: <strong id="money-total">{{ total() }}</strong>
  </p>
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-danger" id="modal-cancel-btn" (click)="onCancel()" [translate]="'CANCEL'"></button>
  <button type="button" class="btn btn-success" id="modal-select-btn" (click)="onSave()" [translate]="'SELECT'"></button>
</div>
