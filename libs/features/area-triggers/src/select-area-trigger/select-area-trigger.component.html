<keira-top-bar
  [selected]="handlerService.selected"
  [handler]="handlerService"
  [selectedName]="handlerService.selectedName"
  [isNew]="handlerService.isNew"
/>

<div class="container-fluid">
  <div class="content-block">
    <p class="small text-muted">{{ 'AREA_TRIGGERS.CREATE_HELP' | translate }}</p>
    <keira-create
      [entityTable]="entityTable"
      [entityIdField]="entityIdField"
      [customStartingId]="customStartingId"
      [handlerService]="handlerService"
      [queryService]="queryService"
    />
  </div>

  <div class="content-block">
    <p class="lead" [translate]="'SELECT_EXISTING'"></p>
    <form [formGroup]="selectService.queryForm" class="mb-2">
      <div class="row">
        <ng-container [formGroup]="selectService.fields">
          <div class="form-group col-sm-6 col-md-4 col-lg-3 col-xl-2">
            <input formControlName="ID" type="number" class="form-control form-control-sm" id="search-id" placeholder="ID" />
          </div>
          <div class="form-group col-sm-6 col-md-4 col-lg-3 col-xl-3">
            <input formControlName="Name" class="form-control form-control-sm" id="search-name" placeholder="Name" />
          </div>
        </ng-container>
        <div class="form-group col-sm-6 col-md-4 col-lg-3 col-xl-2">
          <input formControlName="limit" class="form-control form-control-sm" id="limit" placeholder="Limit" />
        </div>
        <div class="mb-2 col-sm-6 col-md-4 col-lg-3 col-xl-2">
          <button id="search-btn" class="btn btn-primary btn-sm" [disabled]="selectService.queryForm.invalid" (click)="onSearch()">
            <i class="fa fa-search"></i> {{ 'SEARCH' | translate }}
          </button>
        </div>
      </div>
      <keira-highlightjs-wrapper [code]="selectService.query" />
    </form>

    @if (selectService.rows) {
      <div>
        <ngx-datatable
          class="bootstrap table table-striped text-center datatable-select"
          [rows]="selectService.rows"
          [headerHeight]="DTCFG.headerHeight"
          [footerHeight]="DTCFG.footerHeight"
          [columnMode]="DTCFG.columnMode"
          [rowHeight]="DTCFG.rowHeight"
          [limit]="DTCFG.limit"
          [selectionType]="DTCFG.selectionType"
          (select)="selectService.onSelect($event)"
        >
          <ngx-datatable-column name="ID" prop="ID" [maxWidth]="100" />
          <ngx-datatable-column name="Name" prop="Name" [minWidth]="220" />
          <ngx-datatable-column name="target_map" prop="target_map" />
          <ngx-datatable-column name="script" prop="script">
            <ng-template let-row="row" ngx-datatable-cell-template>{{ row.script ?? '-' }}</ng-template>
          </ngx-datatable-column>
          <ngx-datatable-column name="quest" prop="quest">
            <ng-template let-row="row" ngx-datatable-cell-template>{{ row.quest ?? '-' }}</ng-template>
          </ngx-datatable-column>
        </ngx-datatable>
      </div>
    }
  </div>
</div>
