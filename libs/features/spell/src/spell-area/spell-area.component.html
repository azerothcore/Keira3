<keira-top-bar
  [selected]="handlerService.selected"
  [handler]="handlerService"
  [selectedName]="handlerService.selectedName"
  [isNew]="handlerService.isNew"
/>

<div class="container-fluid">
  @if (editorService.loading) {
    <span [translate]="'LOADING'"></span>
  }

  @if (editorService.form && !!editorService.loadedEntityId && !editorService.loading) {
    <div>
      <p class="small text-muted mt-2" id="editor-help">{{ 'EDITORS_HELP.SPELL_AREA' | translate }}</p>
      <div class="content-block">
        <keira-query-output
          [docUrl]="docUrl"
          [isNew]="editorService.isNew"
          [diffQuery]="editorService.diffQuery"
          [fullQuery]="editorService.fullQuery"
          [error]="editorService.error"
          [entityTable]="editorService.entityTable"
          [editorService]="editorService"
          (executeQuery)="save($event)"
        />
      </div>
      <div class="content-block">
        <form [formGroup]="editorService.form" class="form-group edit-form">
          <div class="row">
            <div class="form-group col-12 col-sm-6 col-md-4 col-lg-2">
              <label class="control-label" for="f-spell">spell</label>
              <input [formControlName]="'spell'" id="f-spell" type="number" class="form-control form-control-sm" />
            </div>
            <div class="form-group col-12 col-sm-6 col-md-4 col-lg-2">
              <label class="control-label" for="f-area">area</label>
              <input [formControlName]="'area'" id="f-area" type="number" class="form-control form-control-sm" />
            </div>
            <div class="form-group col-12 col-sm-6 col-md-4 col-lg-2">
              <label class="control-label" for="f-quest-start">quest_start</label>
              <input [formControlName]="'quest_start'" id="f-quest-start" type="number" class="form-control form-control-sm" />
            </div>
            <div class="form-group col-12 col-sm-6 col-md-4 col-lg-2">
              <label class="control-label" for="f-quest-end">quest_end</label>
              <input [formControlName]="'quest_end'" id="f-quest-end" type="number" class="form-control form-control-sm" />
            </div>
            <div class="form-group col-12 col-sm-6 col-md-4 col-lg-2">
              <label class="control-label" for="f-aura-spell">aura_spell</label>
              <input [formControlName]="'aura_spell'" id="f-aura-spell" type="number" class="form-control form-control-sm" />
            </div>
            <div class="form-group col-12 col-sm-6 col-md-4 col-lg-2">
              <label class="control-label" for="f-racemask">racemask</label>
              <input [formControlName]="'racemask'" id="f-racemask" type="number" class="form-control form-control-sm" />
            </div>
            <div class="form-group col-12 col-sm-6 col-md-4 col-lg-2">
              <label class="control-label" for="f-gender">gender</label>
              <input [formControlName]="'gender'" id="f-gender" type="number" class="form-control form-control-sm" />
            </div>
            <div class="form-group col-12 col-sm-6 col-md-4 col-lg-2">
              <label class="control-label" for="f-autocast">autocast</label>
              <input [formControlName]="'autocast'" id="f-autocast" type="number" class="form-control form-control-sm" />
            </div>
            <div class="form-group col-12 col-sm-6 col-md-4 col-lg-2">
              <label class="control-label" for="f-quest-start-status">quest_start_status</label>
              <input
                [formControlName]="'quest_start_status'"
                id="f-quest-start-status"
                type="number"
                class="form-control form-control-sm"
              />
            </div>
            <div class="form-group col-12 col-sm-6 col-md-4 col-lg-2">
              <label class="control-label" for="f-quest-end-status">quest_end_status</label>
              <input [formControlName]="'quest_end_status'" id="f-quest-end-status" type="number" class="form-control form-control-sm" />
            </div>
            <div class="col-12 form-error" [hidden]="editorService.isFormIdUnique()">
              <i class="fas fa-exclamation-triangle"></i>
              <span [innerHTML]="'UNIQUE' | translate: { ENTITY_SECOND_ID_FIELD: editorService.entitySecondIdField }"></span>
            </div>
          </div>
        </form>
        <div class="row">
          <div class="col-12">
            <keira-editor-buttons
              [selectedRowId]="editorService.selectedRowId"
              (deleteSelectedRow)="editorService.deleteSelectedRow()"
              (addNewRow)="editorService.addNewRow()"
              (duplicateRow)="editorService.addNewRow(true)"
            />
            <ngx-datatable
              id="editor-table"
              class="bootstrap table table-striped text-center datatable-select"
              [rows]="editorService.newRows"
              [headerHeight]="DTCFG.headerHeight"
              [footerHeight]="DTCFG.footerHeight"
              [columnMode]="DTCFG.columnMode"
              [rowHeight]="DTCFG.rowHeight"
              [selectionType]="DTCFG.selectionType"
              (select)="editorService.onRowSelection($event)"
              (keydown.delete)="editorService.deleteSelectedRow()"
            >
              <ngx-datatable-column [minWidth]="30" [maxWidth]="30" [sortable]="false">
                <ng-template let-row="row" ngx-datatable-cell-template>
                  <i [hidden]="!editorService.isRowSelected(row)" class="fas fa-chevron-right"></i>
                </ng-template>
              </ngx-datatable-column>
              <ngx-datatable-column name="area" prop="area" />
              <ngx-datatable-column name="quest_start" prop="quest_start" />
              <ngx-datatable-column name="quest_end" prop="quest_end" />
              <ngx-datatable-column name="aura_spell" prop="aura_spell" />
              <ngx-datatable-column name="racemask" prop="racemask" />
              <ngx-datatable-column name="gender" prop="gender" />
              <ngx-datatable-column name="autocast" prop="autocast" />
              <ngx-datatable-column name="quest_start_status" prop="quest_start_status" />
              <ngx-datatable-column name="quest_end_status" prop="quest_end_status" />
            </ngx-datatable>
          </div>
        </div>
      </div>
    </div>
  }
</div>
