<form [formGroup]="browserService.searchForm" class="mb-2">
  <div class="row">
    <div class="form-group col-sm-12 col-md-8 col-lg-6 col-xl-6">
      <input
        [formControlName]="'text'"
        class="form-control form-control-sm"
        id="broadcast-text-search"
        [placeholder]="'CREATURE.TEXT.SEARCH_BROADCAST_TEXT' | translate"
      />
    </div>
    <div class="form-group col-sm-6 col-md-2 col-lg-3 col-xl-2">
      <input [formControlName]="'limit'" type="number" class="form-control form-control-sm" id="broadcast-text-limit" placeholder="Limit" />
    </div>
    <div class="mb-2 col-sm-6 col-md-2 col-lg-3 col-xl-2">
      <button id="broadcast-text-search-btn" class="btn btn-primary btn-sm" (click)="onSearch()">
        <i class="fa fa-search"></i> {{ 'SEARCH' | translate }}
      </button>
    </div>
  </div>
  <keira-highlightjs-wrapper [code]="browserService.query" />
</form>

<button
  id="copy-to-creature-text-btn"
  class="btn btn-success btn-sm mb-2"
  [disabled]="!browserService.selectedRow || !targetRowSelected()"
  (click)="onCopy()"
>
  <i class="fa fa-arrow-up fa-sm"></i> {{ 'CREATURE.TEXT.COPY_TO_ROW' | translate }}
</button>

@if (browserService.rows) {
  <ngx-datatable
    id="broadcast-text-table"
    class="bootstrap table table-striped text-center datatable-select highlight-select"
    [rows]="browserService.rows"
    [headerHeight]="DTCFG.headerHeight"
    [footerHeight]="DTCFG.footerHeight"
    [columnMode]="DTCFG.columnMode"
    [rowHeight]="DTCFG.rowHeight"
    [limit]="DTCFG.limit"
    [selectionType]="DTCFG.selectionType"
    (select)="browserService.onSelect($event)"
  >
    <ngx-datatable-column [minWidth]="30" [maxWidth]="30" [sortable]="false">
      <ng-template let-row="row" ngx-datatable-cell-template>
        <i
          [hidden]="!browserService.isMatchedRow(row)"
          class="fas fa-crosshairs"
          placement="auto"
          [tooltip]="'CREATURE.TEXT.MATCHED_ROW' | translate"
        ></i>
      </ng-template>
    </ngx-datatable-column>
    <ngx-datatable-column name="ID" prop="ID" [minWidth]="60" [maxWidth]="90" />
    <ngx-datatable-column name="LanguageID" prop="LanguageID" [minWidth]="60" [maxWidth]="110" />
    <ngx-datatable-column name="Text" prop="Text" [minWidth]="400" />
  </ngx-datatable>
}
