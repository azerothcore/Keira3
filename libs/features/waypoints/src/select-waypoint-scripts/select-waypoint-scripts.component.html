<keira-top-bar
  [selected]="handlerService.selected"
  [handler]="handlerService"
  [selectedName]="handlerService.selectedName"
  [isNew]="handlerService.isNew"
/>

<div class="container-fluid">
  <div class="content-block">
    <keira-create
      [entityTable]="entityTable"
      [entityIdField]="entityIdField"
      [customStartingId]="customStartingId"
      [handlerService]="handlerService"
      [queryService]="queryService"
    />
  </div>

  <div class="content-block">
    <p class="lead" [translate]="'WAYPOINTS.SELECT_SCRIPT'"></p>
    <form [formGroup]="selectService.queryForm">
      <div class="row">
        <ng-container [formGroup]="selectService.fields">
          <div class="form-group col-sm-6 col-md-4 col-lg-3 col-xl-2">
            <input [formControlName]="'id'" type="number" class="form-control form-control-sm" id="search-id" placeholder="id" />
          </div>
          <div class="form-group col-sm-6 col-md-4 col-lg-3 col-xl-2">
            <input [formControlName]="'delay'" type="number" class="form-control form-control-sm" id="search-delay" placeholder="delay" />
          </div>
          <div class="form-group col-sm-6 col-md-4 col-lg-3 col-xl-2">
            <input
              [formControlName]="'command'"
              type="number"
              class="form-control form-control-sm"
              id="search-command"
              placeholder="command"
            />
          </div>
          <div class="form-group col-sm-6 col-md-4 col-lg-3 col-xl-2">
            <input
              [formControlName]="'datalong'"
              type="number"
              class="form-control form-control-sm"
              id="search-datalong"
              placeholder="datalong"
            />
          </div>
          <div class="form-group col-sm-6 col-md-4 col-lg-3 col-xl-2">
            <input
              [formControlName]="'datalong2'"
              type="number"
              class="form-control form-control-sm"
              id="search-datalong2"
              placeholder="datalong2"
            />
          </div>
          <div class="form-group col-sm-6 col-md-4 col-lg-3 col-xl-2">
            <input
              [formControlName]="'dataint'"
              type="number"
              class="form-control form-control-sm"
              id="search-dataint"
              placeholder="dataint"
            />
          </div>
          <div class="form-group col-sm-6 col-md-4 col-lg-3 col-xl-2">
            <input [formControlName]="'guid'" type="number" class="form-control form-control-sm" id="search-guid" placeholder="guid" />
          </div>
        </ng-container>
        <div class="form-group col-sm-6 col-md-4 col-lg-3 col-xl-2">
          <input [formControlName]="'limit'" class="form-control form-control-sm" id="limit" placeholder="Limit" />
        </div>
        <div class="mb-2 col-sm-6 col-md-4 col-lg-3 col-xl-2">
          <button id="search-btn" class="btn btn-primary btn-sm" [disabled]="selectService.queryForm.invalid" (click)="onSearch()">
            <i class="fa fa-search"></i> {{ 'SEARCH' | translate }}
          </button>
        </div>
      </div>
      <keira-highlightjs-wrapper [code]="selectService.query" />
    </form>

    @if (selectService.rows) {
      <div>
        <ngx-datatable
          class="bootstrap table table-striped text-center datatable-select"
          [rows]="selectService.rows"
          [headerHeight]="DTCFG.headerHeight"
          [footerHeight]="DTCFG.footerHeight"
          [columnMode]="DTCFG.columnMode"
          [rowHeight]="DTCFG.rowHeight"
          [limit]="DTCFG.limit"
          [selectionType]="DTCFG.selectionType"
          (select)="selectService.onSelect($event)"
          [offset]="selectService.pageOffset"
          (page)="onPage($event)"
        >
          <ngx-datatable-column name="id" prop="id" [minWidth]="80" />
          <ngx-datatable-column [name]="'WAYPOINTS.COL_ACTIONS' | translate" prop="actions" [minWidth]="80" />
          <ngx-datatable-column [name]="'WAYPOINTS.COL_COMMANDS' | translate" prop="commands" [minWidth]="120" />
          <ngx-datatable-column [name]="'WAYPOINTS.COL_USED' | translate" prop="used" [minWidth]="90" />
        </ngx-datatable>
      </div>
    }
  </div>
</div>
