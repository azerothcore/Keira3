<text x="250" y="60" font-size="13" font-weight="bold" text-anchor="end">Left trigger (Button 7)</text>
<text x="250" y="75" font-size="11" text-anchor="end">Move down</text>
<text x="250" y="110" font-size="13" font-weight="bold" text-anchor="end">Left bumper (Button 5)</text>
<text x="250" y="125" font-size="11" text-anchor="end">Zoom out</text>
<text x="250" y="165" font-size="13" font-weight="bold" text-anchor="end">Select (Button 9)</text>
<text x="250" y="180" font-size="11" text-anchor="end" fill="#909090">(free)</text>
<text x="250" y="215" font-size="13" font-weight="bold" text-anchor="end">D-pad</text>
<text x="250" y="230" font-size="11" text-anchor="end" fill="#909090">Up: (free)</text>
<text x="250" y="245" font-size="11" text-anchor="end" fill="#909090">Down: (free)</text>
<text x="250" y="260" font-size="11" text-anchor="end" fill="#909090">Left: (free)</text>
<text x="250" y="275" font-size="11" text-anchor="end" fill="#909090">Right: (free)</text>
<text x="250" y="315" font-size="13" font-weight="bold" text-anchor="end">Left stick</text>
<text x="250" y="330" font-size="11" text-anchor="end">Up: Move forward</text>
<text x="250" y="345" font-size="11" text-anchor="end">Down: Move back</text>
<text x="250" y="360" font-size="11" text-anchor="end">Left: Move left</text>
<text x="250" y="375" font-size="11" text-anchor="end">Right: Move right</text>
<text x="250" y="390" font-size="11" text-anchor="end">Press (Button 11): Faster (held)</text>
<text x="850" y="60" font-size="13" font-weight="bold" text-anchor="start">Right trigger (Button 8)</text>
<text x="850" y="75" font-size="11" text-anchor="start">Move up</text>
<text x="850" y="110" font-size="13" font-weight="bold" text-anchor="start">Right bumper (Button 6)</text>
<text x="850" y="125" font-size="11" text-anchor="start">Zoom in</text>
<text x="850" y="165" font-size="13" font-weight="bold" text-anchor="start">Start (Button 10)</text>
<text x="850" y="180" font-size="11" text-anchor="start" fill="#909090">(free)</text>
<text x="850" y="215" font-size="13" font-weight="bold" text-anchor="start">Buttons (Y, A, X, B)</text>
<text x="850" y="230" font-size="11" text-anchor="start">Up, Y (Button 4): Camera to the marker</text>
<text x="850" y="245" font-size="11" text-anchor="start">Down, A (Button 2): Put the marker under the cursor</text>
<text x="850" y="260" font-size="11" text-anchor="start" fill="#909090">Left, X (Button 1): (free)</text>
<text x="850" y="275" font-size="11" text-anchor="start" fill="#909090">Right, B (Button 3): (free)</text>
<text x="850" y="315" font-size="13" font-weight="bold" text-anchor="start">Right stick</text>
<text x="850" y="330" font-size="11" text-anchor="start">Up: Look up</text>
<text x="850" y="345" font-size="11" text-anchor="start">Down: Look down</text>
<text x="850" y="360" font-size="11" text-anchor="start">Left: Turn left</text>
<text x="850" y="375" font-size="11" text-anchor="start">Right: Turn right</text>
<text x="850" y="390" font-size="11" text-anchor="start" fill="#909090">Press (Button 12): (free)</text>
<text x="550" y="462" font-size="13" font-weight="bold" text-anchor="middle">Home (Button 13)</text>
<text x="550" y="477" font-size="11" text-anchor="middle" fill="#909090">(free)</text>
<text x="20" y="566" font-size="12">Buttons are named as on an Xbox pad and numbered as Windows' game controller settings number them; other pads have the same ones in the same places.</text>
<text x="20" y="586" font-size="12">Red: clashes with another action. (free): nothing on it yet. The gamepad works in the world editor only, for the camera and the marker.</text>
</svg>
