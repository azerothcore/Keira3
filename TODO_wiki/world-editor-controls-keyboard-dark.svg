<text x="269" y="490" font-size="13">Panels</text>
<text x="20" y="514" font-size="12">Keys without Ctrl, Shift or Alt. Red border: the key clashes with another action (the first in the list wins).</text>
<text x="20" y="540" font-size="13" font-weight="bold">Mouse, gamepad and combinations</text>
<text x="20" y="560" font-size="11">Move forward: Pad Left Stick Up</text>
<text x="540" y="560" font-size="11">Move back: Pad Left Stick Down</text>
<text x="1060" y="560" font-size="11">Move left: Pad Left Stick Left</text>
<text x="20" y="576" font-size="11">Move right: Pad Left Stick Right</text>
<text x="540" y="576" font-size="11">Move up: Pad Right Trigger</text>
<text x="1060" y="576" font-size="11">Move down: Pad Left Trigger</text>
<text x="20" y="592" font-size="11">Turn left: Pad Right Stick Left</text>
<text x="540" y="592" font-size="11">Turn right: Pad Right Stick Right</text>
<text x="1060" y="592" font-size="11">Look up: Pad Right Stick Up</text>
<text x="20" y="608" font-size="11">Look down: Pad Right Stick Down</text>
<text x="540" y="608" font-size="11">Zoom in: Pad Right Bumper</text>
<text x="1060" y="608" font-size="11">Zoom out: Pad Left Bumper</text>
<text x="20" y="624" font-size="11">Faster (held): Pad Left Stick Press</text>
<text x="540" y="624" font-size="11">Put the marker under the cursor: Pad A (Down)</text>
<text x="1060" y="624" font-size="11">Camera to the marker: Pad Y (Up)</text>
<text x="20" y="640" font-size="11">Undo: Ctrl+Z</text>
<text x="540" y="640" font-size="11">Redo: Ctrl+Y, Ctrl+Shift+Z</text>
<text x="1060" y="640" font-size="11">Copy the selection: Ctrl+C</text>
<text x="20" y="656" font-size="11">Paste at the crosshair: Ctrl+V</text>
