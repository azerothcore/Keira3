version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Renovate handles version updates (see renovate.json); 0 keeps only Dependabot security updates
    open-pull-requests-limit: 0
    ignore:
      # patched via patch-package, bump by hand (see patches/README.md)
      - dependency-name: ngx-bootstrap
      # Angular pins the supported TypeScript range, bump it together with Angular
      - dependency-name: typescript
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
